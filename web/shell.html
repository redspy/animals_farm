<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<!-- [animals_farm 수정] interactive-widget=resizes-content:
		     소프트 키보드가 올라올 때 **레이아웃 뷰포트까지 줄이게** 한다. 이러면
		     캔버스가 보이는 영역에 맞춰 작아지고, 캐릭터는 줄어든 캔버스 중앙에
		     그대로 남는다. 기본값(resizes-visual)에서는 캔버스 크기가 그대로여서
		     아래쪽이 키보드에 가려지고, 브라우저가 입력창을 보이려고 페이지를
		     스크롤해 **캔버스 상단이 화면 밖으로 밀렸다**(2026-09-05 폰 실측). -->
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, interactive-widget=resizes-content">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	/* [animals_farm 수정] 페이지가 스크롤되면 캔버스 상단이 화면 밖으로 밀려
	   HUD가 사라지고 캐릭터가 위로 치우쳐 보인다(폰 실측). 화면에 고정한다. */
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	overscroll-behavior: none;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;

// [animals_farm 수정] **실제로 탭/앱을 떠났다 돌아온 경우만** 카운트한다.
// 게임은 이 카운터가 늘어날 때 서버와 재동기화한다. 창 포커스(blur/focus)로
// 판단하면 채팅 입력창을 닫는 것만으로도 재동기화가 걸려, 방금 지시한 이동이
// 서버 위치로 되돌려졌다(2026-09-05 실측).
(function () {
	window.afHiddenAt = 0;
	window.afResumeToken = 0;
	const MIN_AWAY_MS = 800;   // 짧은 포커스 이동은 무시
	document.addEventListener('visibilitychange', function () {
		if (document.hidden) {
			window.afHiddenAt = Date.now();
		} else if (window.afHiddenAt && Date.now() - window.afHiddenAt >= MIN_AWAY_MS) {
			window.afHiddenAt = 0;
			window.afResumeToken += 1;
		}
	});
})();

// [animals_farm 수정] **iOS 사파리에서 키보드를 띄우려면 focus()가 사용자
// 제스처(터치) 핸들러 안에서 호출돼야 한다.** 게임의 채팅 버튼은 캔버스 안에
// 그려진 것이라, 탭 → Godot 신호 → GDScript가 focus()를 부르는 경로는 이미
// 제스처를 벗어난 다음 프레임이다. 안드로이드 크롬은 그래도 키보드를 띄우지만
// 사파리는 무시한다(사용자 보고 2026-09-05: "사파리에서 텍스트 입력할 때
// 키보드가 안나와").
//
// 그래서 게임이 "여기를 누르면 브라우저 API를 써야 한다"는 영역을 캔버스
// 비율(0~1)로 알려주고(window.afHotspots), 여기서 **터치 핸들러 안에서 직접**
// 그 API를 부른다. 비율로 주는 이유는 DPR·스트레치 배율을 셸이 몰라도 되게
// 하려는 것이다. 전체화면도 같은 제약을 받으므로 같은 통로를 쓴다.
(function () {
	// 게임이 알려주는 "여기를 누르면 브라우저 API를 써야 한다"는 영역들.
	// 값은 [x, y, w, h, 동작] 이고 동작은 요소 id(포커스) 또는 'fullscreen'이다.
	window.afHotspots = {};
	// 옛 이름(입력창 전용이던 시절) — 아직 참조하는 코드가 있어도 같은 객체를 본다.
	window.afTextHotspots = window.afHotspots;
	window.afFullscreen = false;
	window.afFullscreenRequests = 0;
	window.afFullscreenLastError = '';
	// **아이폰 사파리에는 Fullscreen API가 없다**(비디오 전용
	// webkitEnterFullscreen만 있다). 게임은 이 값을 보고 버튼을 숨긴다 —
	// 안 그러면 눌러도 아무 일 없는 "고장난 버튼"이 폰에 남는다.
	// iframe에 allowfullscreen이 없는 경우도 이 플래그로 같이 걸러진다.
	window.afFullscreenSupported = !!(
		document.fullscreenEnabled || document.webkitFullscreenEnabled
	) && !!(
		document.documentElement.requestFullscreen
		|| document.documentElement.webkitRequestFullscreen
	);
	document.addEventListener('fullscreenchange', function () {
		window.afFullscreen = document.fullscreenElement != null;
	});
	document.addEventListener('webkitfullscreenchange', function () {
		window.afFullscreen = (document.webkitFullscreenElement || document.fullscreenElement) != null;
	});
	function focusInput(id) {
		var el = document.getElementById(id);
		if (!el) return;
		if (el.style.display === 'none') el.style.display = 'block';
		try { el.focus(); } catch (e) { /* 포커스 불가 상태는 무시 */ }
	}
	// **전체화면도 사용자 제스처 안에서만 허용된다**(키보드와 같은 제약).
	// Godot 버튼을 누른 뒤 GDScript에서 요청하면 이미 제스처를 벗어난 다음
	// 프레임이라 브라우저가 거절한다 — 그래서 여기서 직접 부른다.
	function toggleFullscreen() {
		if (!window.afFullscreenSupported) {
			window.afFullscreenLastError = 'unsupported';
			return;
		}
		var el = document.documentElement;
		var active = (document.fullscreenElement || document.webkitFullscreenElement) != null;
		try {
			var p = active
				? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
				: (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
			window.afFullscreenRequests += 1;
			window.afFullscreenLastError = '';
			// **거절은 비동기로 온다.** requestFullscreen은 Promise를 돌려주고
			// 동기 예외는 사실상 API가 없을 때뿐이라, catch만 두면 가장 흔한
			// 실패(정책·제스처 밖 거절)를 놓치고 콘솔에 uncaught rejection이
			// 남는다. webkit 계열은 Promise를 안 주므로 존재 확인이 필요하다.
			// 이전 요청의 늦은 reject가 이후 성공의 빈 오류를 덮어쓰지 않게
			// 요청 번호를 클로저에 담아 최신 요청일 때만 기록한다.
			var reqId = window.afFullscreenRequests;
			if (p && typeof p.catch === 'function') {
				p.catch(function (e) {
					if (window.afFullscreenRequests !== reqId) return;
					window.afFullscreenLastError = String(e && e.message ? e.message : e);
				});
			}
		} catch (e) {
			window.afFullscreenLastError = String(e && e.message ? e.message : e);
		}
	}
	function act(spec) {
		if (spec === 'fullscreen') { toggleFullscreen(); return; }
		focusInput(spec);
	}
	// touchend 뒤에 오는 **합성 click**을 시계가 아니라 이벤트로 걸러낸다.
	// 합성 click의 지연은 브라우저가 보장하는 값이 아니라 메인 스레드가 얼마나
	// 막혀 있었나에 좌우된다 — WASM 프레임이 길어지면 몇백 ms를 넘고, 시계
	// 기반 가드는 그 순간 한 번의 탭을 "켜고 바로 끄기"로 만든다(리뷰 지적).
	// 다음 click 한 번만 삼키면 원인 쪽에서 막힌다. 마우스 전용 브라우저는
	// touchend가 없어 플래그가 서지 않으므로 영향이 없다.
	var swallowNextClick = false;
	function onGesture(ev) {
		if (ev.type === 'click') {
			if (swallowNextClick) { swallowNextClick = false; return; }
		} else if (ev.type === 'touchend') {
			swallowNextClick = true;
		}
		var canvas = document.querySelector('canvas');
		if (!canvas) return;
		var rect = canvas.getBoundingClientRect();
		if (!(rect.width > 0 && rect.height > 0)) return;
		var pt = (ev.changedTouches && ev.changedTouches[0]) || ev;
		if (typeof pt.clientX !== 'number') return;
		var fx = (pt.clientX - rect.left) / rect.width;
		var fy = (pt.clientY - rect.top) / rect.height;
		for (var key in window.afHotspots) {
			var h = window.afHotspots[key];
			if (!h || h.length < 5) continue;
			if (fx >= h[0] && fx <= h[0] + h[2] && fy >= h[1] && fy <= h[1] + h[3]) {
				act(h[4]);
				return;
			}
		}
	}
	// capture 단계에서 받는다 — 엔진이 이벤트를 소비해도 우리가 먼저 본다.
	document.addEventListener('touchend', onGesture, true);
	document.addEventListener('click', onGesture, true);
})();

// [animals_farm 수정] 입력창에 포커스가 가면 브라우저가 그걸 보이게 하려고
// 페이지를 스크롤한다. 캔버스가 화면에 고정돼 있어야 HUD가 잘리지 않으므로,
// 스크롤이 생기면 즉시 되돌린다.
(function () {
	const resetScroll = () => {
		if (window.scrollY !== 0 || window.scrollX !== 0) window.scrollTo(0, 0);
	};
	window.addEventListener('scroll', resetScroll, { passive: true });
	window.addEventListener('focusin', () => setTimeout(resetScroll, 50));
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', () => setTimeout(resetScroll, 50));
		window.visualViewport.addEventListener('scroll', resetScroll);
	}
})();

// [animals_farm 수정] 비보안 컨텍스트(http)에서는 AudioWorklet이 아예 없어서
// (`audioContext.audioWorklet`가 undefined) Godot 오디오 초기화가 예외를 던지고
// **엔진 시작 자체가 실패**한다(실측: "Cannot read properties of undefined
// (reading 'addModule')" → 화면이 그대로 멈춤).
//
// 그래서 두 가지를 함께 한다:
//  1) 오디오 드라이버를 Dummy로 요청한다(엔진 인자). **new Engine() 앞에서**
//     설정해야 반영된다 — 뒤에서 바꿨더니 무시됐다.
//  2) 그래도 엔진이 audioWorklet에 접근하므로, addModule이 reject하는 스텁을
//     심어 예외 대신 실패로 흘려보낸다.
if (!window.isSecureContext) {
	GODOT_CONFIG['args'] = (GODOT_CONFIG['args'] || []).concat(['--audio-driver', 'Dummy']);
	try {
		const Ctx = window.AudioContext || window.webkitAudioContext;
		if (Ctx && !Ctx.prototype.audioWorklet) {
			Object.defineProperty(Ctx.prototype, 'audioWorklet', {
				configurable: true,
				get() {
					return { addModule: () => Promise.reject(new Error('insecure context: AudioWorklet unavailable')) };
				},
			});
		}
	} catch (err) {
		console.warn('[animals_farm] audioWorklet 스텁 설치 실패:', err);
	}
}
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	// [animals_farm 수정] Godot 기본 셸은 보안 컨텍스트(HTTPS)가 아니면 실행을
	// 아예 거부한다. 그런데 이 게임은 nothreads 빌드로 SharedArrayBuffer가
	// 필요 없고, 실제로 보안 컨텍스트를 요구하는 기능은 오디오(AudioWorklet)
	// 뿐이다. 사내망/집 와이파이의 http://192.168.x.x 로 폰에서 붙는 경우를
	// 지원하려고, **보안 컨텍스트 항목만** 경고로 낮춘다.
	//
	// 대가: http로 열면 소리가 나지 않을 수 있다(AudioWorklet 사용 불가).
	// 소리를 쓰기 시작하면 HTTPS가 사실상 필수가 된다 — 그때 이 완화를 거둔다.
	const allMissing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});
	const insecureOnly = allMissing.filter((m) => m.indexOf('Secure Context') === 0);
	const missing = allMissing.filter((m) => m.indexOf('Secure Context') !== 0);
	if (insecureOnly.length > 0) {
		console.warn('[animals_farm] 보안 컨텍스트가 아닙니다(http). 게임은 실행하지만 소리가 나지 않을 수 있습니다.');
	}

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
